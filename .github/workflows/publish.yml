name: Publish Workflow
on:
  workflow_call:
    inputs:
      build-id:
        required: true
        type: string

jobs:
  build-and-publish-docker-image:
    name: Build & Publish Docker Image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df #4.2.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: gp2gp_github_action_build_workflow
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build Docker Image
        run: |
          DOCKER_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          DOCKER_TAG="$DOCKER_REGISTRY/nhais:${{ inputs.build-id }}"
          echo "DOCKER_TAG=$DOCKER_TAG" >> $GITHUB_ENV

          # Build Image
          docker build -f ./Dockerfile -t $DOCKER_TAG .

      - name: Make script executable
        run: chmod +x ./scripts/sbom-generator.sh

      - name: Run the shell script
        run: ./scripts/sbom-generator.sh

      - name: Collect Artifacts
        run: |
          mkdir -p artifacts
          pwd
          ls
      
          cp -r ./sbom-spdx.json ./artifacts

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SBOM Report
          path: ./artifacts/**
          compression-level: 9

      - name: Temporary Artifacts Cleanup
        if: always()
        run: rm -rf ./artifacts

