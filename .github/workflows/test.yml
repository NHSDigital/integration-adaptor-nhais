name: Test Workflow
on:
  workflow_call:

jobs:
  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Java 21 LTS
        uses: actions/setup-java@ead9eaa3cfe0b0fc2fa749519ae09c3d4f4080b0
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2

      - name: Checkstyle
        run: ./gradlew checkStyleMain checkstyleTest checkstyleIntTest

      - name: Collect Artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp -r ./build/reports ./artifacts

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: 'Checkstyle Reports'
          path: ./artifacts/**
          compression-level: 9

      - name: Temporary Artifacts Cleanup
        run: rm -rf ./artifacts

  unit-tests:
    name: Unit Tests
    needs: [ checkstyle ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Java 21
        uses: actions/setup-java@ead9eaa3cfe0b0fc2fa749519ae09c3d4f4080b0
        with:
          java-version: 21
          distribution: temurin

      - name: Execute Unit Tests
        run: ./gradlew test --parallel --build-cache

      - name: Collect Artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp -r ./build/reports ./artifacts

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Unit Test Report
          path: ./artifacts/**
          compression-level: 9

      - name: Test Job Summary
        if: always()
        uses: test-summary/action@31493c76ec9e7aa675f1585d3ed6f1da69269a86
        with:
          paths: ./build/test-results/test/TEST-*.xml

      - name: Temporary Artifacts Cleanup
        run: rm -rf ./artifacts

  component-tests:
    name: Component Tests
    needs: [ checkstyle ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Java 21
        uses: actions/setup-java@ead9eaa3cfe0b0fc2fa749519ae09c3d4f4080b0
        with:
          java-version: 21
          distribution: temurin

      - name: Execute Component Tests
        run: ./gradlew componentTest --build-cache

      - name: Collect Artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp -r ./build/reports ./artifacts

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Component Test Report
          path: ./artifacts/**
          compression-level: 9

      - name: Test Job Summary
        if: always()
        uses: test-summary/action@31493c76ec9e7aa675f1585d3ed6f1da69269a86
        with:
          paths: ./build/test-results/componentTest/TEST-*.xml

      - name: Temporary Artifacts Cleanup
        run: rm -rf ./artifacts

  integration_tests:
    name: Integration Tests
    needs: [ checkstyle ]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Java
        uses: actions/setup-java@ead9eaa3cfe0b0fc2fa749519ae09c3d4f4080b0
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Required Docker Images
        run: docker compose up mongodb activemq fake-mesh -d

      - name: Execute Integration Tests
        run: ./gradlew integrationTest

      - name: Dump Docker Logs
        if: always()
        run: |
          mkdir -p ./logs
          container_names=$(docker ps -a --format '{{.Names}}')
          for container in $container_names; do
              docker logs "$container" > ./logs/"$container".log
              echo "Logs saved for container: $container"
          done
        shell: bash

      - name: Collect Artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp -r ./build/reports ./artifacts
          cp -r ./logs ./artifacts

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Integration Test Report & Docker Logs
          path: ./artifacts/**
          compression-level: 9

      - name: Test Job Summary
        if: always()
        uses: test-summary/action@31493c76ec9e7aa675f1585d3ed6f1da69269a86
        with:
          paths: ./build/test-results/integrationTest/TEST-*.xml

      - name: Stop Docker Dependencies
        if: always()
        run: docker compose down --rmi=local --remove-orphans

      - name: Temporary Artifacts Cleanup
        run: rm -rf ./artifacts
