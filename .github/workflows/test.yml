name: Test Workflow
on:
  workflow_call:
    inputs:
      path:
        required: true
        type: string

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin

      - name: Execute Unit Tests
        run: ./gradlew test --parallel --build-cache
        working-directory: ${{ inputs.path }}

      - name: Collect Artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp -r ./${{ inputs.path }}/build/reports ./artifacts

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Unit Test Report
          path: ./artifacts/**
          compression-level: 9

      - name: Test Job Summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: "${{ inputs.path }}/build/test-results/test/TEST-*.xml"

      - name: Temporary Artifacts Cleanup
        run: rm -rf ./artifacts

  component-tests:
    name: Component Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin

      - name: Execute Component Tests
        run: ./gradlew componentTest --build-cache
        working-directory: ${{ inputs.path }}

      - name: Collect Artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp -r ./${{ inputs.path }}/build/reports ./artifacts

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Component Test Report
          path: ./artifacts/**
          compression-level: 9

      - name: Test Job Summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: "${{ inputs.path }}/build/test-results/componentTest/TEST-*.xml"

      - name: Temporary Artifacts Cleanup
        run: rm -rf ./artifacts

  integration_tests:
    name: Integration Tests
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

#      - name: Configure AWS Credentials
#        uses: aws-actions/configure-aws-credentials@v4
#        with:
#          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_TO_ASSUME }}
#          role-session-name: gp2gp_github_action_build_workflow
#          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Required Docker Images
        working-directory: ${{ inputs.path }}
        run: docker-compose up mongodb activemq fake-mesh

      - name: Execute Integration Tests
        working-directory: ${{ inputs.path }}
        run: ./gradlew integrationTest

      - name: Dump Docker Logs
        if: always()
        run: |
          mkdir -p ./logs
          container_names=$(docker ps -a --format '{{.Names}}')
          for container in $container_names; do
              docker logs "$container" > ./logs/"$container".log
              echo "Logs saved for container: $container"
          done
        working-directory: ./scripts
        shell: bash

      - name: Collect Artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp -r ./${{ inputs.path }}/build/reports ./artifacts
          cp -r ./scripts/logs ./artifacts

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Integration Test Report & Docker Logs
          path: ./artifacts/**
          compression-level: 9

      - name: Test Job Summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: "./${{ inputs.path }}/build/test-results/integrationTest/TEST-*.xml"

      - name: Stop Docker Dependencies
        if: always()
        run: |
          docker compose down --rmi=local --remove-orphans
          docker compose rm
        working-directory: ./docker

      - name: Temporary Artifacts Cleanup
        run: rm -rf ./artifacts
