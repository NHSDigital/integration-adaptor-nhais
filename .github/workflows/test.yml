name: Test Workflow
on:
  workflow_call:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Execute Unit Tests
        run: ./gradlew test --parallel --build-cache

      - name: Collect Artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp -r ./build/reports ./artifacts

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Unit Test Report
          path: ./artifacts/**
          compression-level: 9

      - name: Test Job Summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: ./build/test-results/test/TEST-*.xml

      - name: Temporary Artifacts Cleanup
        run: rm -rf ./artifacts

  component-tests:
    name: Component Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Execute Component Tests
        run: ./gradlew componentTest --build-cache

      - name: Collect Artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp -r ./build/reports ./artifacts

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Component Test Report
          path: ./artifacts/**
          compression-level: 9

      - name: Test Job Summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: ./build/test-results/componentTest/TEST-*.xml

      - name: Temporary Artifacts Cleanup
        run: rm -rf ./artifacts

  integration_tests:
    name: Integration Tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Required Docker Images
        run: docker compose up mongodb activemq fake-mesh -d

      - name: Execute Integration Tests
        run: ./gradlew integrationTest

      - name: Dump Docker Logs
        if: always()
        run: |
          mkdir -p ./logs
          container_names=$(docker ps -a --format '{{.Names}}')
          for container in $container_names; do
              docker logs "$container" > ./logs/"$container".log
              echo "Logs saved for container: $container"
          done
        shell: bash

      - name: Collect Artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp -r ./build/reports ./artifacts
          cp -r ./logs ./artifacts

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Integration Test Report & Docker Logs
          path: ./artifacts/**
          compression-level: 9

      - name: Test Job Summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: ./build/test-results/integrationTest/TEST-*.xml

      - name: Stop Docker Dependencies
        if: always()
        run: docker compose down --rmi=local --remove-orphans

      - name: Temporary Artifacts Cleanup
        run: rm -rf ./artifacts
